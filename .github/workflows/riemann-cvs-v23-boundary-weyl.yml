  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build the repaired boundary-gap module
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.BoundaryGapNoCrossing
          lake env lean RiemannCvs/BoundaryGapNoCrossing.lean

      - name: Build the concrete displacement and determinant bridges
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.CvSParityDisplacement
          lake env lean RiemannCvs/CvSParityDisplacement.lean
          lake build RiemannCvs.CombinedSymbolDyadicL2
          lake env lean RiemannCvs/CombinedSymbolDyadicL2.lean
          lake build RiemannCvs.PrimeTranslationFourierBridge
          lake env lean RiemannCvs/PrimeTranslationFourierBridge.lean
          lake build RiemannCvs.PrimeTranslationPowerBound
          lake env lean RiemannCvs/PrimeTranslationPowerBound.lean
          lake build RiemannCvs.WeightedSchurSupersolution
          lake env lean RiemannCvs/WeightedSchurSupersolution.lean
          lake build RiemannCvs.PrimeTranslationSupersolution
          lake env lean RiemannCvs/PrimeTranslationSupersolution.lean
          lake build RiemannCvs.PrimeTranslationContinuousSupersolution
          lake env lean RiemannCvs/PrimeTranslationContinuousSupersolution.lean
          lake build RiemannCvs.PrimeTranslationContinuousSchur
          lake env lean RiemannCvs/PrimeTranslationContinuousSchur.lean
          lake build RiemannCvs.PrimeTranslationContinuousFourier
          lake env lean RiemannCvs/PrimeTranslationContinuousFourier.lean
          lake build RiemannCvs.ObliqueWeylDeterminant
          lake env lean RiemannCvs/ObliqueWeylDeterminant.lean

      - name: Build the V23 cumulative-residue surface
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.BoundaryWeylCumulative
          lake env lean RiemannCvs/BoundaryWeylCumulative.lean
          lake build RiemannCvs.BoundaryWeylUniformLimit
          lake env lean RiemannCvs/BoundaryWeylUniformLimit.lean
          lake build RiemannCvs.BoundaryWeylSchurTail
          lake env lean RiemannCvs/BoundaryWeylSchurTail.lean
          lake build RiemannCvs.BoundaryWeylFarLeft
          lake env lean RiemannCvs/BoundaryWeylFarLeft.lean
          lake build RiemannCvs.V23BoundaryWeylMainline
          lake env lean RiemannCvs/V23BoundaryWeylMainline.lean
          lake build RiemannCvs.ArchimedeanRemainderSchur
          lake env lean RiemannCvs/ArchimedeanRemainderSchur.lean
          lake build RiemannCvs.AsymptoticTailRelativeCoupling
          lake env lean RiemannCvs/AsymptoticTailRelativeCoupling.lean
          lake build RiemannCvs.AsymptoticTailOperatorBound
          lake env lean RiemannCvs/AsymptoticTailOperatorBound.lean
          lake build RiemannCvs.AsymptoticCoreNewestArchimedean
          lake env lean RiemannCvs/AsymptoticCoreNewestArchimedean.lean
          lake build RiemannCvs.AsymptoticCoreNewestTotalError
          lake env lean RiemannCvs/AsymptoticCoreNewestTotalError.lean
          lake build RiemannCvs.AsymptoticCoreHilbert
          lake env lean RiemannCvs/AsymptoticCoreHilbert.lean
          lake build RiemannCvs.AsymptoticCoreHilbertPi
          lake env lean RiemannCvs/AsymptoticCoreHilbertPi.lean
          lake build RiemannCvs.AsymptoticAdjacentCoreHilbertPi
          lake env lean RiemannCvs/AsymptoticAdjacentCoreHilbertPi.lean
          lake build RiemannCvs.AdjacentArchimedeanHilbertSchmidt
          lake env lean RiemannCvs/AdjacentArchimedeanHilbertSchmidt.lean
          lake build RiemannCvs.AdjacentArchimedeanSharpGap
          lake env lean RiemannCvs/AdjacentArchimedeanSharpGap.lean
          lake build RiemannCvs.FirstAnalyticMultiblockBudget
          lake env lean RiemannCvs/FirstAnalyticMultiblockBudget.lean
          lake build RiemannCvs.HistoricalCombinedLoewnerTransport
          lake env lean RiemannCvs/HistoricalCombinedLoewnerTransport.lean
          lake build RiemannCvs.FullBuilderLoewnerTransport
          lake env lean RiemannCvs/FullBuilderLoewnerTransport.lean
          lake build RiemannCvs.FiniteMatrixBoundaryWeylAdapter
          lake env lean RiemannCvs/FiniteMatrixBoundaryWeylAdapter.lean
          lake build RiemannCvs.PrimeTranslationSeparatedBands
          lake env lean RiemannCvs/PrimeTranslationSeparatedBands.lean
          lake build RiemannCvs.PoleSeparatedBands
          lake env lean RiemannCvs/PoleSeparatedBands.lean
          lake build RiemannCvs.ArchimedeanSeparatedBands
          lake env lean RiemannCvs/ArchimedeanSeparatedBands.lean

      - name: Reject placeholders and audit theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/BoundaryGapNoCrossing.lean
            RiemannCvs/BoundaryWeylCumulative.lean
            RiemannCvs/BoundaryWeylUniformLimit.lean
            RiemannCvs/BoundaryWeylSchurTail.lean
            RiemannCvs/BoundaryWeylFarLeft.lean
            RiemannCvs/CvSParityDisplacement.lean
            RiemannCvs/CombinedSymbolDyadicL2.lean
            RiemannCvs/PrimeTranslationFourierBridge.lean
            RiemannCvs/PrimeTranslationSeparatedBands.lean
            RiemannCvs/PoleSeparatedBands.lean
            RiemannCvs/ArchimedeanSeparatedBands.lean
            RiemannCvs/PrimeTranslationPowerBound.lean
            RiemannCvs/PrimeTranslationSupersolution.lean
            RiemannCvs/PrimeTranslationContinuousSupersolution.lean
            RiemannCvs/PrimeTranslationContinuousSchur.lean
            RiemannCvs/PrimeTranslationContinuousFourier.lean
            RiemannCvs/WeightedSchurSupersolution.lean
            RiemannCvs/DigammaEulerMaclaurin.lean
            RiemannCvs/C13ArchimedeanEndpoint.lean
            RiemannCvs/ObliqueWeylDeterminant.lean
            RiemannCvs/V23BoundaryWeylMainline.lean
            RiemannCvs/ArchimedeanRemainderSchur.lean
            RiemannCvs/AsymptoticTailRelativeCoupling.lean
            RiemannCvs/AsymptoticTailOperatorBound.lean
            RiemannCvs/AsymptoticCoreNewestArchimedean.lean
            RiemannCvs/AsymptoticCoreNewestTotalError.lean
            RiemannCvs/AsymptoticCoreHilbert.lean
            RiemannCvs/AsymptoticCoreHilbertPi.lean
            RiemannCvs/AsymptoticAdjacentCoreHilbertPi.lean
            RiemannCvs/AdjacentArchimedeanHilbertSchmidt.lean
            RiemannCvs/AdjacentArchimedeanSharpGap.lean
            RiemannCvs/FirstAnalyticMultiblockBudget.lean
            RiemannCvs/HistoricalCombinedLoewnerTransport.lean
            RiemannCvs/FullBuilderLoewnerTransport.lean
            RiemannCvs/FiniteMatrixBoundaryWeylAdapter.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'proof placeholder detected' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "${files[@]}"; then
            echo 'user axiom or constant detected' >&2
            exit 1
          fi
          cat > V23BoundaryWeylAxioms.lean <<'LEAN'
          import RiemannCvs.V23BoundaryWeylMainline
          import RiemannCvs.ArchimedeanRemainderSchur
          import RiemannCvs.AsymptoticTailRelativeCoupling
          import RiemannCvs.AsymptoticTailOperatorBound
          import RiemannCvs.AsymptoticCoreNewestArchimedean
          import RiemannCvs.AsymptoticCoreNewestTotalError
          import RiemannCvs.AsymptoticCoreHilbert
          import RiemannCvs.AsymptoticCoreHilbertPi
          import RiemannCvs.AsymptoticAdjacentCoreHilbertPi
          import RiemannCvs.AdjacentArchimedeanHilbertSchmidt
          import RiemannCvs.AdjacentArchimedeanSharpGap
          import RiemannCvs.FirstAnalyticMultiblockBudget
          import RiemannCvs.HistoricalCombinedLoewnerTransport
          import RiemannCvs.FullBuilderLoewnerTransport
          import RiemannCvs.FiniteMatrixBoundaryWeylAdapter
          import RiemannCvs.PrimeTranslationSeparatedBands
          import RiemannCvs.PoleSeparatedBands
          import RiemannCvs.ArchimedeanSeparatedBands
          import RiemannCvs.PrimeTranslationSupersolution
          import RiemannCvs.PrimeTranslationContinuousSupersolution
          import RiemannCvs.PrimeTranslationContinuousSchur
          import RiemannCvs.PrimeTranslationContinuousFourier
          import RiemannCvs.WeightedSchurSupersolution
          #print axioms RiemannCvs.BoundaryGapNoCrossing.boundaryValueNonzeroOfStrictConstraintGap
          #print axioms RiemannCvs.BoundaryGapNoCrossing.noCommonEigenvalueFromConstraintGaps
          #print axioms RiemannCvs.CvSParityDisplacement.oddDifferenceKernel_displacement
          #print axioms RiemannCvs.CvSParityDisplacement.oddDifferenceKernel_evenParity_offDiagonal
          #print axioms RiemannCvs.CvSParityDisplacement.oddDifferenceKernel_oddParity_offDiagonal
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.finiteSineSymbol_odd
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.combinedSineSymbol_odd
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.fourierNormalizedSymbol_odd
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.oddDifferenceKernel_add
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.oddDifferenceKernel_smul
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.oddDifferenceKernel_fourierNormalized
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.oddDifferenceKernel_fourierNormalized_combined
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.sin_two_pi_nat
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.norm_geometric_sum_le_inv_abs_sin_half
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.norm_shifted_geometric_sum_le_inv_abs_sin_half
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.exp_nat_mul_real_phase
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.norm_shifted_exp_sum_le_inv_abs_sin_half
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.abs_shifted_sine_sum_le_inv_abs_sin_half
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.abs_shifted_cosine_sum_le_inv_abs_sin_half
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.finiteLogarithmicPrimeSymbol_odd
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.logarithmicCombinedSymbol_odd
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.oddDifferenceKernel_fourierNormalized_logarithmicCombined
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.logarithmicPrimePhase_self
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.logarithmicPrimeEndpoint_sine_zero
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.logarithmicPrimeEndpoint_term_zero
          #print axioms RiemannCvs.CombinedSymbolDyadicL2.finiteLogarithmicPrimeEntry_eq_sum_eventEntries
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.truncatedTranslationFourierEntry_offDiagonal
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.logarithmicPrimeEventEntry_eq_weight_mul_truncatedTranslation
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.finiteLogarithmicPrimeEntry_eq_translationCompression
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.signedMode_evenEnergy_eq_two_mul
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.signedMode_oddEnergy_eq_two_mul
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.evenModeEnergy_abs_le_of_signedModeEnergy
          #print axioms RiemannCvs.PrimeTranslationFourierBridge.oddModeEnergy_abs_le_of_signedModeEnergy
          #print axioms RiemannCvs.PrimeTranslationPowerBound.norm_pow_six
          #print axioms RiemannCvs.PrimeTranslationPowerBound.norm_lt_tenThird_of_norm_pow_six_lt
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13PrimeTranslationWeight_lt_upper
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13Supersolution_endpoint_rows_le
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13Supersolution_open_rows_le
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13ActualPrimeTranslationRow_le_upper
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13UpperPrimeTranslationRow_eq_ratCast
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13ActualPrimeTranslationRow_openSamples_lt
          #print axioms RiemannCvs.PrimeTranslationSupersolution.c13ActualPrimeTranslationRow_breakpoints_lt
          #print axioms RiemannCvs.WeightedSchurSupersolution.weightedTwoMul_le
          #print axioms RiemannCvs.WeightedSchurSupersolution.weightedSchur_quadratic
