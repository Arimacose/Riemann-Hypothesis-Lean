            --output research/riemann-cvs-lean/RiemannCvs/PrimeTranslationContinuousSupersolution.lean \
            --check
          python research/riemann-cvs-numerics/certify_prime_translation_supersolution.py \
            --prec 256 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_supersolution.json

      - name: Certify the c13 Archimedean tail envelope
        shell: bash
