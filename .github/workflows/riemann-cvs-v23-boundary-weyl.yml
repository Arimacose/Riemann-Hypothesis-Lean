            --prime-certificate research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json \
            --archimedean-certificate research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail.json \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_combined_symbol_newest_energy.json
          python research/riemann-cvs-numerics/certify_combined_symbol_newest_energy.py \
            --c 13 \
            --prec 384 \
            --start-previous-cutoff 3840 \
            --first-open-previous-cutoff 1920 \
            --target 1/30 \
            --shift-gain 1/1024 \
            --combined-certificate research/riemann-cvs-numerics/artifacts/v23_c13_N1920_combined_symbol_dyadic_l2_384bit.json \
            --prime-certificate research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json \
            --archimedean-certificate research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail_384bit.json \
