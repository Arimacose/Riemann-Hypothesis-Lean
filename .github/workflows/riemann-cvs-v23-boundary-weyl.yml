          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixedRemoteEvenBuilderError_sum_eq_total
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixedRemoteOddBuilderError_sum_eq_total
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteEvenTotalErrorCrossEnergy_sq_le_dyadic
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteOddTotalErrorCrossEnergy_sq_le_dyadic
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13FixedRemoteEvenBuilderMatrix_crossEnergy_eq_totalError
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13FixedRemoteOddBuilderMatrix_crossEnergy_eq_totalError
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteEvenBuilderCrossEnergy_sq_le_dyadic
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteOddBuilderCrossEnergy_sq_le_dyadic
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteEvenBuilderCrossEnergy_sq_le_summableAmplitude
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.c13_fixed3840_remoteOddBuilderCrossEnergy_sq_le_summableAmplitude
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.summable_c13_fixedRemoteBuilderDyadicAmplitude
          #print axioms RiemannCvs.ArchimedeanSeparatedBands.tsum_c13_fixedRemoteBuilderDyadicAmplitude
          LEAN
          lake env lean V23BoundaryWeylAxioms.lean | tee v23-boundary-weyl-axioms.txt
          if grep -E 'sorryAx' v23-boundary-weyl-axioms.txt; then
            echo 'proof placeholder dependency detected' >&2
            exit 1
          fi
          if grep -vE 'propext|Classical.choice|Quot.sound|depends on axioms|^$' \
              v23-boundary-weyl-axioms.txt | grep -E 'axiom'; then
            echo 'unexpected axiom detected' >&2
            exit 1
          fi

      - name: Upload axiom transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v23-boundary-weyl-axioms
          path: research/riemann-cvs-lean/v23-boundary-weyl-axioms.txt
          if-no-files-found: warn

  numeric-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mpmath==1.3.0 \
            numpy==2.3.3 \
            python-flint==0.8.0 \
            sympy==1.14.0

      - name: Replay the V22 normalization audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/audit_zero_mode_correction.py \
            --c 13 \
            --dps 120 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_v22_zero_mode_c13.json

      - name: Audit the conservative V23 boundary-Weyl Schur budget
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/audit_log_tail_structure.py \
            --schur-c 13 \
            --schur-fixed-cutoff 20 \
            --schur-low-gap 0.0009765625 \
            --schur-shift-gain 0.0009765625 \
            --schur-margin 0.0175525530977914393795820608 \
            --schur-eta-norm-sq 41 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_log_tail_schur_budget.json

      - name: Certify the c13 prime-translation power bound
        shell: bash
