name: Riemann CvS V23 boundary-Weyl reduction

on:
  push:
    branches:
      - main
      - research/cvs-boundary-weyl-v23
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryGapNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylCumulative.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylUniformLimit.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylSchurTail.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylFarLeft.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CvSParityDisplacement.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ObliqueWeylDeterminant.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V23BoundaryWeylMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V22ZeroModeMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ZeroModeCorrection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ParityOrderContinuation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/PiecewiseParityContinuation.lean'
      - 'research/riemann-cvs-numerics/audit_zero_mode_correction.py'
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-numerics/certify_relative_energy_coupling.py'
      - 'research/riemann-cvs-numerics/certify_recursive_relative_energy_shells.py'
      - 'research/riemann-cvs-numerics/certify_preconditioned_relative_shell.py'
      - 'research/riemann-cvs-numerics/certify_direct_parity_relative_shell.py'
      - 'research/riemann-cvs-numerics/probe_relative_shell_budget.py'
      - 'research/riemann-cvs-numerics/probe_dyadic_shell_scaling.py'
      - 'research/riemann-cvs-numerics/certify_prime_translation_power_bound.py'
      - 'research/riemann-cvs-numerics/certify_archimedean_tail_envelope.py'
      - 'research/riemann-cvs-numerics/certify_eventual_dyadic_middle_channel.py'
      - 'research/riemann-cvs-numerics/certify_boundary_weyl_cumulative.py'
      - 'research/riemann-cvs-numerics/certify_parity_gap.py'
      - 'research/riemann-cvs-notes/V23_BOUNDARY_WEYL_CUMULATIVE.md'
      - '.github/workflows/riemann-cvs-v23-boundary-weyl.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryGapNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylCumulative.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylUniformLimit.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylSchurTail.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryWeylFarLeft.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CvSParityDisplacement.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ObliqueWeylDeterminant.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V23BoundaryWeylMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V22ZeroModeMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ZeroModeCorrection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SylvesterNoCrossing.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ParityOrderContinuation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/PiecewiseParityContinuation.lean'
      - 'research/riemann-cvs-numerics/audit_zero_mode_correction.py'
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-numerics/certify_relative_energy_coupling.py'
      - 'research/riemann-cvs-numerics/certify_recursive_relative_energy_shells.py'
      - 'research/riemann-cvs-numerics/certify_preconditioned_relative_shell.py'
      - 'research/riemann-cvs-numerics/certify_direct_parity_relative_shell.py'
      - 'research/riemann-cvs-numerics/probe_relative_shell_budget.py'
      - 'research/riemann-cvs-numerics/probe_dyadic_shell_scaling.py'
      - 'research/riemann-cvs-numerics/certify_prime_translation_power_bound.py'
      - 'research/riemann-cvs-numerics/certify_archimedean_tail_envelope.py'
      - 'research/riemann-cvs-numerics/certify_eventual_dyadic_middle_channel.py'
      - 'research/riemann-cvs-numerics/certify_boundary_weyl_cumulative.py'
      - 'research/riemann-cvs-numerics/certify_parity_gap.py'
      - 'research/riemann-cvs-notes/V23_BOUNDARY_WEYL_CUMULATIVE.md'
      - '.github/workflows/riemann-cvs-v23-boundary-weyl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build the repaired boundary-gap module
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.BoundaryGapNoCrossing
          lake env lean RiemannCvs/BoundaryGapNoCrossing.lean

      - name: Build the concrete displacement and determinant bridges
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.CvSParityDisplacement
          lake env lean RiemannCvs/CvSParityDisplacement.lean
          lake build RiemannCvs.ObliqueWeylDeterminant
          lake env lean RiemannCvs/ObliqueWeylDeterminant.lean

      - name: Build the V23 cumulative-residue surface
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake build RiemannCvs.BoundaryWeylCumulative
          lake env lean RiemannCvs/BoundaryWeylCumulative.lean
          lake build RiemannCvs.BoundaryWeylUniformLimit
          lake env lean RiemannCvs/BoundaryWeylUniformLimit.lean
          lake build RiemannCvs.BoundaryWeylSchurTail
          lake env lean RiemannCvs/BoundaryWeylSchurTail.lean
          lake build RiemannCvs.BoundaryWeylFarLeft
          lake env lean RiemannCvs/BoundaryWeylFarLeft.lean
          lake build RiemannCvs.V23BoundaryWeylMainline
          lake env lean RiemannCvs/V23BoundaryWeylMainline.lean

      - name: Reject placeholders and audit theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/BoundaryGapNoCrossing.lean
            RiemannCvs/BoundaryWeylCumulative.lean
            RiemannCvs/BoundaryWeylUniformLimit.lean
            RiemannCvs/BoundaryWeylSchurTail.lean
            RiemannCvs/BoundaryWeylFarLeft.lean
            RiemannCvs/CvSParityDisplacement.lean
            RiemannCvs/ObliqueWeylDeterminant.lean
            RiemannCvs/V23BoundaryWeylMainline.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'proof placeholder detected' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "${files[@]}"; then
            echo 'user axiom or constant detected' >&2
            exit 1
          fi
          cat > V23BoundaryWeylAxioms.lean <<'LEAN'
          import RiemannCvs.V23BoundaryWeylMainline
          #print axioms RiemannCvs.BoundaryGapNoCrossing.boundaryValueNonzeroOfStrictConstraintGap
          #print axioms RiemannCvs.BoundaryGapNoCrossing.noCommonEigenvalueFromConstraintGaps
          #print axioms RiemannCvs.CvSParityDisplacement.oddDifferenceKernel_displacement
          #print axioms RiemannCvs.CvSParityDisplacement.poleKernel_displacement
          #print axioms RiemannCvs.CvSParityDisplacement.parityMatrix_displacement
          #print axioms RiemannCvs.CvSParityDisplacement.parityMatrix_displacement_centralCorrected
          #print axioms RiemannCvs.CvSParityDisplacement.parityMulVec_displacement
          #print axioms RiemannCvs.CvSParityDisplacement.concreteSylvesterRelation
          #print axioms RiemannCvs.CvSParityDisplacement.eq_central_smul_of_derivative_mulVec_eq_zero
          #print axioms RiemannCvs.CvSParityDisplacement.boundaryEuclideanVector_apply
          #print axioms RiemannCvs.CvSParityDisplacement.boundaryEuclideanVector_norm_sq
          #print axioms RiemannCvs.CvSParityDisplacement.boundaryEuclideanVector_norm_sq_fin
          #print axioms RiemannCvs.CvSParityDisplacement.boundaryEuclideanVector_norm_sq_fin_twenty
          #print axioms RiemannCvs.CvSParityDisplacement.boundaryEuclideanVector_inner_eq_boundaryFunctional
          #print axioms RiemannCvs.ObliqueWeylDeterminant.polynomialRatio_eq_residueSum
          #print axioms RiemannCvs.ObliqueWeylDeterminant.sum_interpolationResidue_eq_coeff
          #print axioms RiemannCvs.ObliqueWeylDeterminant.characteristicRatio_eq_residueSum
          #print axioms RiemannCvs.ObliqueWeylDeterminant.sum_characteristicResidue_eq_one
          #print axioms RiemannCvs.ObliqueWeylDeterminant.neg_characteristicRatio_eq_boundaryWeylSum
          #print axioms RiemannCvs.ObliqueWeylDeterminant.neg_determinantRatio_eq_boundaryWeylSum
          #print axioms RiemannCvs.ObliqueWeylDeterminant.determinantFactorization_eq_neg_boundaryWeylSum
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteAbelSummation
          #print axioms RiemannCvs.BoundaryWeylCumulative.weightedSum_posOfCumulative
          #print axioms RiemannCvs.BoundaryWeylCumulative.weightedSum_ge_finalCumulativeTerm
          #print axioms RiemannCvs.BoundaryWeylCumulative.weightedSum_ge_prefixDrop
          #print axioms RiemannCvs.BoundaryWeylCumulative.reciprocalPoleDrop_monoOnLeft
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ge_finalCumulativeTerm
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ge_prefixDrop
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ge_prefixDropAtLeft
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ge_margin
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ge_ratio_of_finalBounds
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_pos_beforeFirstPole
          #print axioms RiemannCvs.BoundaryWeylCumulative.finiteBoundaryWeyl_ne_zero_beforeFirstPole
          #print axioms RiemannCvs.BoundaryWeylCumulative.factorizedNumerator_ne_zero_beforeFirstPole
          #print axioms RiemannCvs.BoundaryWeylCumulative.rankOneCorrectedWeyl_pos
          #print axioms RiemannCvs.BoundaryWeylCumulative.rankOneCorrectedBoundaryWeyl_pos_beforeFirstPole
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.lowerBoundOn_of_pointwiseLimit
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.positiveOn_of_pointwiseLimit_uniformMargin
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.nonzeroOn_of_pointwiseLimit_uniformMargin
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.positiveOn_of_finiteMargin_and_uniformError
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_pos_of_uniformFinalTerms
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_pos_of_uniformPrefixDrops
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_pos_of_oneCutoffError
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_ne_zero_of_oneCutoffError
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_pos_of_prefixDropError
          #print axioms RiemannCvs.BoundaryWeylUniformLimit.boundaryWeylLimit_posOn_Icc_of_prefixDropAtLeftError
          #print axioms RiemannCvs.BoundaryWeylSchurTail.lowComponentError_norm_le
          #print axioms RiemannCvs.BoundaryWeylSchurTail.finiteResolvent_norm_le
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylError_le_of_blockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.commutator_norm_le_two_mul_of_norm_bounds
          #print axioms RiemannCvs.BoundaryWeylSchurTail.commutator_norm_le_one_div_two_mul
          #print axioms RiemannCvs.BoundaryWeylSchurTail.schurProductBudget_of_highGapBudget
          #print axioms RiemannCvs.BoundaryWeylSchurTail.highGapBudget_false_of_linearBoundaryGrowth
          #print axioms RiemannCvs.BoundaryWeylSchurTail.lowEnergy_le_relativeHighEnergy
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeSchurResponseNonnegative
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeSchurResponseBudget
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCoupling_of_formGrowth
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCoupling_of_coerciveNormBounds
          #print axioms RiemannCvs.BoundaryWeylSchurTail.twoBlockEnergy_nonnegative
          #print axioms RiemannCvs.BoundaryWeylSchurTail.oneTwelfthShell_balancedReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.balancedShellBudget_le_fourTwentySevenths
          #print axioms RiemannCvs.BoundaryWeylSchurTail.fourNinthsShell_oneThirdReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCouplingSlack_lowReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCouplingSlack_highReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCouplingSlack_balancedReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCouplingSlack_balancedLowerBound
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCouplingSlack_v23BalancedLowerBound
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeShell_of_referenceReserve
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCoupling_of_twoChannelBudgets
          #print axioms RiemannCvs.BoundaryWeylSchurTail.fourNinthsShell_of_twoChannelReference
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCoupling_of_scaledFormNonnegative
          #print axioms RiemannCvs.BoundaryWeylSchurTail.relativeCoupling_of_recursiveShell
          #print axioms RiemannCvs.BoundaryWeylSchurTail.recursiveShellEnergy_nonnegative_nat
          #print axioms RiemannCvs.BoundaryWeylSchurTail.recursiveShellEnergy_limit_nonnegative
          #print axioms RiemannCvs.BoundaryWeylSchurTail.recursiveShellEnergy_limit_nonnegative_of_uniformRho
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylRelativeEnergyBudget
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeyl_mono_of_relativeEnergyCoupling
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeyl_pos_of_relativeEnergyCoupling
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylError_le_of_weightedBlockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylError_le_margin_of_weightedBlockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.weightedSchurBudget_of_upperBounds
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylError_le_margin_of_blockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylError_le_margin_of_blockSchur_highGapBudget
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylErrorOn_le_margin_of_blockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeylErrorOn_le_margin_of_weightedBlockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.boundaryWeyl_monoOn_of_relativeEnergyCoupling
          #print axioms RiemannCvs.BoundaryWeylSchurTail.positiveOn_of_relativeEnergyCoupling
          #print axioms RiemannCvs.BoundaryWeylSchurTail.positiveOn_of_finiteMargin_and_blockSchur
          #print axioms RiemannCvs.BoundaryWeylSchurTail.positiveOn_of_finiteMargin_and_weightedBlockSchur
          #print axioms RiemannCvs.BoundaryWeylFarLeft.finiteBoundaryWeyl_sub_oneDiv_abs_le
          #print axioms RiemannCvs.BoundaryWeylFarLeft.finiteBoundaryWeyl_ge_farLeftMargin
          #print axioms RiemannCvs.BoundaryWeylFarLeft.boundaryWeylLimit_pos_of_uniformFarLeftMoment
          #print axioms RiemannCvs.BoundaryWeylFarLeft.positiveOn_openNegativeTail_of_compact_and_farLeft
          LEAN
          lake env lean V23BoundaryWeylAxioms.lean | tee v23-boundary-weyl-axioms.txt
          if grep -vE 'propext|Classical.choice|Quot.sound|depends on axioms|^$' \
              v23-boundary-weyl-axioms.txt | grep -E 'axiom'; then
            echo 'unexpected axiom detected' >&2
            exit 1
          fi

      - name: Upload axiom transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v23-boundary-weyl-axioms
          path: research/riemann-cvs-lean/v23-boundary-weyl-axioms.txt
          if-no-files-found: warn

  numeric-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mpmath==1.3.0 \
            numpy==2.3.3 \
            python-flint==0.8.0 \
            sympy==1.14.0

      - name: Replay the V22 normalization audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/audit_zero_mode_correction.py \
            --c 13 \
            --dps 120 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_v22_zero_mode_c13.json

      - name: Audit the conservative V23 boundary-Weyl Schur budget
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/audit_log_tail_structure.py \
            --schur-c 13 \
            --schur-fixed-cutoff 20 \
            --schur-low-gap 0.0009765625 \
            --schur-shift-gain 0.0009765625 \
            --schur-margin 0.0175525530977914393795820608 \
            --schur-eta-norm-sq 41 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_log_tail_schur_budget.json

      - name: Certify the c13 prime-translation power bound
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_prime_translation_power_bound.py \
            --c 13 \
            --power 6 \
            --target 10/3 \
            --prec 256 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json

      - name: Certify the c13 Archimedean tail envelope
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_archimedean_tail_envelope.py \
            --c 13 \
            --minimum-mode 960 \
            --diagonal-offset 19/20 \
            --symbol-upper 4/5 \
            --centered-decay 1/4 \
            --prec 256 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail.json
          python research/riemann-cvs-numerics/certify_archimedean_tail_envelope.py \
            --c 13 \
            --minimum-mode 960 \
            --diagonal-offset 19/20 \
            --symbol-upper 4/5 \
            --centered-decay 1/4 \
            --prec 384 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail_384bit.json

      - name: Certify the eventual V23 dyadic middle channel
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_eventual_dyadic_middle_channel.py \
            --c 13 \
            --prime-certificate research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json \
            --archimedean-certificate research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail.json \
            --start-mode 1920 \
            --finite-frontier 3840 \
            --shift-gain 1/1024 \
            --channel-target 2/27 \
            --prec 256 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_eventual_middle_channel.json
          python research/riemann-cvs-numerics/certify_eventual_dyadic_middle_channel.py \
            --c 13 \
            --prime-certificate research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json \
            --archimedean-certificate research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail_384bit.json \
            --start-mode 1920 \
            --finite-frontier 3840 \
            --shift-gain 1/1024 \
            --channel-target 2/27 \
            --prec 384 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_eventual_middle_channel_384bit.json

      - name: Certify the finite V23 relative-energy coupling route
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_relative_energy_coupling.py \
            --c 13 \
            --low-cutoff 20 \
            --big-cutoff 120 \
            --prec 2000 \
            --shift-gain 1/1024 \
            --q-upper 999/1000 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N20_to_N120_relative_energy.json

      - name: Certify the recursive V23 relative-energy shells
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_recursive_relative_energy_shells.py \
            --c 13 \
            --low-cutoff 20 \
            --base-cutoff 120 \
            --stage 240:1/3 \
            --stage 480:1/5 \
            --prec 900 \
            --shift-gain 1/1024 \
            --q-upper 999/1000 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_recursive_relative_energy_shells.json

      - name: Certify the tighter V23 reserve through N960
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_recursive_relative_energy_shells.py \
            --c 13 \
            --low-cutoff 20 \
            --base-cutoff 480 \
            --stage 960:1/7 \
            --prec 900 \
            --shift-gain 1/1024 \
            --q-upper 249/250 \
            --target-q 999/1000 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_q996_N480_to_N960_shell.json

      - name: Certify the preconditioned V23 shell through N1920
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_preconditioned_relative_shell.py \
            --c 13 \
            --low-cutoff 20 \
            --core-cutoff 960 \
            --shell-cutoff 1920 \
            --prec 256 \
            --shift-gain 1/1024 \
            --q-upper 249/250 \
            --rho-upper 1/12 \
            --core-certificate research/riemann-cvs-numerics/artifacts/v23_c13_q996_N480_to_N960_shell.json \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_q996_N960_to_N1920_preconditioned_shell.json

      - name: Certify the direct-parity V23 shell through N3840
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_direct_parity_relative_shell.py \
            --c 13 \
            --low-cutoff 20 \
            --core-cutoff 1920 \
            --shell-cutoff 3840 \
            --prec 256 \
            --shift-gain 1/1024 \
            --q-upper 249/250 \
            --rho-upper 4/9 \
            --threads 4 \
            --core-certificate research/riemann-cvs-numerics/artifacts/v23_c13_q996_N960_to_N1920_preconditioned_shell.json \
            --validate-cutoff 120 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_direct.json

      - name: Smoke-test the relative-shell midpoint probe
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/probe_relative_shell_budget.py \
            --c 13 \
            --low-cutoff 20 \
            --core-cutoff 120 \
            --shell-cutoff 240 \
            --prec 160 \
            --shift-gain 1/1024 \
            --reference-q 999/1000 \
            --direct-q 999/1000 \
            --direct-q 249/250 \
            --reserve 1/666 \
            --candidate-rho 1/3 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N120_to_N240_shell_midpoint_smoke.json

      - name: Probe post-N1920 dyadic-shell scaling
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/probe_dyadic_shell_scaling.py \
            --c 13 \
            --low-cutoff 20 \
            --previous-cutoff 960 \
            --core-cutoff 1920 \
            --shell-cutoff 3840 \
            --prec 160 \
            --shift-gain 1/1024 \
            --reference-q 999/1000 \
            --dyadic-reference-q 249/250 \
            --dyadic-reserve 1/3 \
            --direct-q 249/250 \
            --reserve 1/666 \
            --candidate-rho 4/9 \
            --validate-cutoff 120 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_four_ninths_scaling.json

      - name: Replay the corrected finite Arb parity certificate
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_parity_gap.py \
            --c 13 \
            --N 20 \
            --prec 900 \
            --threshold 1e-38 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N20_parity_gap.json

      - name: Certify the V23 cumulative boundary-Weyl residues
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_boundary_weyl_cumulative.py \
            --c 13 \
            --N 20 \
            --prec 900 \
            --dps 180 \
            --iterations 120 \
            --margin-left=-100 \
            --margin-right=0 \
            --margin-prefix-index 11 \
            --moment-upper 2 \
            --json-out research/riemann-cvs-numerics/artifacts/v23_c13_N20_boundary_weyl_cumulative.json

      - name: Probe the fixed-prefix compact margin across a cutoff grid
        shell: bash
        run: |
          set -euo pipefail
          for N in 12 16 24; do
            python research/riemann-cvs-numerics/certify_boundary_weyl_cumulative.py \
              --c 13 \
              --N "${N}" \
              --prec 900 \
              --dps 180 \
              --iterations 120 \
              --margin-left=-100 \
              --margin-right=0 \
              --margin-prefix-index 11 \
              --moment-upper 2 \
              --json-out "research/riemann-cvs-numerics/artifacts/v23_c13_N${N}_boundary_weyl_compact_margin.json"
          done

      - name: Upload V23 regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v23-v22-regression
          path: |
            research/riemann-cvs-numerics/artifacts/v23_v22_zero_mode_c13.json
            research/riemann-cvs-numerics/artifacts/v23_c13_log_tail_schur_budget.json
            research/riemann-cvs-numerics/artifacts/v23_c13_prime_translation_power6.json
            research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail.json
            research/riemann-cvs-numerics/artifacts/v23_c13_N960_archimedean_tail_384bit.json
            research/riemann-cvs-numerics/artifacts/v23_c13_eventual_middle_channel.json
            research/riemann-cvs-numerics/artifacts/v23_c13_eventual_middle_channel_384bit.json
            research/riemann-cvs-numerics/artifacts/v23_c13_N20_to_N120_relative_energy.json
            research/riemann-cvs-numerics/artifacts/v23_c13_recursive_relative_energy_shells.json
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N480_to_N960_shell.json
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N960_to_N1920_preconditioned_shell.json
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N960_to_N1920_preconditioned_shell_even_preconditioner.npy
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N960_to_N1920_preconditioned_shell_odd_preconditioner.npy
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_direct.json
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_direct_even_preconditioner.npy
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_direct_odd_preconditioner.npy
            research/riemann-cvs-numerics/artifacts/v23_c13_N120_to_N240_shell_midpoint_smoke.json
            research/riemann-cvs-numerics/artifacts/v23_c13_q996_N1920_to_N3840_four_ninths_scaling.json
            research/riemann-cvs-numerics/artifacts/v23_c13_N20_parity_gap.json
            research/riemann-cvs-numerics/artifacts/v23_c13_N20_boundary_weyl_cumulative.json
