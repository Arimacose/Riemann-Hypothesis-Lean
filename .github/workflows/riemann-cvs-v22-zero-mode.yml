name: Riemann CvS V22 zero-mode correction

on:
  push:
    branches:
      - main
      - research/cvs-prolate-v17
      - research/cvs-zero-mode-v22
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ZeroModeCorrection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V22ZeroModeMainline.lean'
      - 'research/riemann-cvs-numerics/audit_zero_mode_correction.py'
      - 'research/riemann-cvs-numerics/certify_parity_gap.py'
      - 'research/riemann-cvs-numerics/explore_smooth_cutoff_velocity.py'
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-notes/V22_ZERO_MODE_CORRECTION.md'
      - '.github/workflows/riemann-cvs-v22-zero-mode.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ZeroModeCorrection.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/V22ZeroModeMainline.lean'
      - 'research/riemann-cvs-numerics/audit_zero_mode_correction.py'
      - 'research/riemann-cvs-numerics/certify_parity_gap.py'
      - 'research/riemann-cvs-numerics/explore_smooth_cutoff_velocity.py'
      - 'research/riemann-cvs-numerics/audit_log_tail_structure.py'
      - 'research/riemann-cvs-notes/V22_ZERO_MODE_CORRECTION.md'
      - '.github/workflows/riemann-cvs-v22-zero-mode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build the V22 zero-mode surface
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RiemannCvs/ZeroModeCorrection.lean
          lake build RiemannCvs.ZeroModeCorrection
          lake env lean RiemannCvs/V22ZeroModeMainline.lean
          lake build RiemannCvs.V22ZeroModeMainline

      - name: Reject placeholders and audit theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/ZeroModeCorrection.lean
            RiemannCvs/V22ZeroModeMainline.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'proof placeholder detected' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "${files[@]}"; then
            echo 'user axiom or constant detected' >&2
            exit 1
          fi
          cat > /tmp/V22ZeroModeAxioms.lean <<'LEAN'
          import RiemannCvs.V22ZeroModeMainline
          #print axioms RiemannCvs.ZeroModeCorrection.g1Partial_pos
          #print axioms RiemannCvs.ZeroModeCorrection.g2Partial_pos
          #print axioms RiemannCvs.ZeroModeCorrection.zeroModeDelta_partial_pos
          #print axioms RiemannCvs.ZeroModeCorrection.correctedXC_lt_base
          #print axioms RiemannCvs.ZeroModeCorrection.archDiagonal_corrected
          #print axioms RiemannCvs.ZeroModeCorrection.cutoffFreeEntry_corrected
          #print axioms RiemannCvs.ZeroModeCorrection.correctedQuadratic_eq_on_kernel
          #print axioms RiemannCvs.ZeroModeCorrection.correctedQuadratic_le
          #print axioms RiemannCvs.ZeroModeCorrection.correctedQuadratic_lt
          #print axioms RiemannCvs.ZeroModeCorrection.zeroCoordinateSector_invisible
          LEAN
          lake env lean /tmp/V22ZeroModeAxioms.lean | tee /tmp/v22-zero-mode-axioms.txt
          if grep -vE 'propext|Classical.choice|Quot.sound|depends on axioms|^$' \
              /tmp/v22-zero-mode-axioms.txt | grep -E 'axiom'; then
            echo 'unexpected axiom detected' >&2
            exit 1
          fi

      - name: Upload axiom transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v22-zero-mode-axioms
          path: /tmp/v22-zero-mode-axioms.txt
          if-no-files-found: warn

  numeric:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mpmath==1.3.0 \
            numpy==2.3.3 \
            python-flint==0.8.0

      - name: Audit the V22 zero mode and exact normalization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/audit_zero_mode_correction.py \
            --c 13 \
            --dps 120 \
            --json-out research/riemann-cvs-numerics/artifacts/v22_zero_mode_c13.json

      - name: Replay the corrected finite Arb certificate
        shell: bash
        run: |
          set -euo pipefail
          python research/riemann-cvs-numerics/certify_parity_gap.py \
            --c 13 \
            --N 20 \
            --prec 900 \
            --threshold 1e-38 \
            --json-out research/riemann-cvs-numerics/artifacts/v22_c13_N20_parity_gap.json

      - name: Upload V22 numerical audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v22-zero-mode-c13
          path: |
            research/riemann-cvs-numerics/artifacts/v22_zero_mode_c13.json
            research/riemann-cvs-numerics/artifacts/v22_c13_N20_parity_gap.json
          if-no-files-found: error
