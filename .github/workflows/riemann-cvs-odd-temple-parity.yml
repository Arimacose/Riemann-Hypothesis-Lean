name: Riemann CvS odd-Temple parity verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CommonLeadingWeilTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/RadicalTailTransfer.lean'
      - '.github/workflows/riemann-cvs-odd-temple-parity.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/CommonLeadingWeilTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/RadicalTailTransfer.lean'
      - '.github/workflows/riemann-cvs-odd-temple-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build odd-Temple transfer module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.OddTempleParityTransfer

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/OddTempleParityTransfer.lean; then
            exit 1
          fi
          cat > /tmp/OddTempleParityAxioms.lean <<'EOF'
          import RiemannCvs.OddTempleParityTransfer
          #print axioms RiemannCvs.OddTempleParityTransfer.templeCorrectionFromResidualBudget
          #print axioms RiemannCvs.OddTempleParityTransfer.quarticParityFromTempleLoss
          #print axioms RiemannCvs.OddTempleParityTransfer.commonLeadingTempleQuarticTransfer
          #print axioms RiemannCvs.OddTempleParityTransfer.commonLeadingTempleResidualTransfer
          #print axioms RiemannCvs.OddTempleParityTransfer.fixedHermiteGroundParityFromQuarterBudgets
          #print axioms RiemannCvs.OddTempleParityTransfer.fixedHermiteGroundParityFromTempleData
          EOF
          lake env lean /tmp/OddTempleParityAxioms.lean | tee odd-temple-parity-axioms.txt
          if grep -E 'sorryAx' odd-temple-parity-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-odd-temple-parity-axioms
          path: research/riemann-cvs-lean/odd-temple-parity-axioms.txt
