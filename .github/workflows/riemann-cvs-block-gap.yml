name: Riemann CvS block-gap verification

on:
  push:
    branches:
      - main
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BlockGapTransfer.lean'
      - '.github/workflows/riemann-cvs-block-gap.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BlockGapTransfer.lean'
      - '.github/workflows/riemann-cvs-block-gap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build block-gap module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.BlockGapTransfer

      - name: Reject proof placeholders and user axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' RiemannCvs/BlockGapTransfer.lean; then
            echo 'Proof placeholder detected.' >&2
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' RiemannCvs/BlockGapTransfer.lean; then
            echo 'User axiom/constant detected.' >&2
            exit 1
          fi

      - name: Print theorem axiom dependencies
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          cat > BlockGapAxioms.lean <<'EOF'
          import RiemannCvs.BlockGapTransfer
          #print axioms RiemannCvs.BlockGapTransfer.twoByTwoFormNonnegative
          #print axioms RiemannCvs.BlockGapTransfer.blockLowerBound
          #print axioms RiemannCvs.BlockGapTransfer.lambdaEightBlockLowerBound
          #print axioms RiemannCvs.BlockGapTransfer.lambdaEightDeterminantFromCouplingBudget
          #print axioms RiemannCvs.BlockGapTransfer.quarticEvenOddSeparation
          #print axioms RiemannCvs.BlockGapTransfer.quarticEvenOddSeparationFromCouplingBudget
          EOF
          lake env lean BlockGapAxioms.lean | tee block-gap-axioms.txt
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('block-gap-axioms.txt').read_text(encoding='utf-8')
          pattern = re.compile(
              r"'([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]"
              r'|does not depend on any axioms)',
              re.DOTALL,
          )
          reports = pattern.findall(text)
          expected = {
              'RiemannCvs.BlockGapTransfer.twoByTwoFormNonnegative',
              'RiemannCvs.BlockGapTransfer.blockLowerBound',
              'RiemannCvs.BlockGapTransfer.lambdaEightBlockLowerBound',
              'RiemannCvs.BlockGapTransfer.lambdaEightDeterminantFromCouplingBudget',
              'RiemannCvs.BlockGapTransfer.quarticEvenOddSeparation',
              'RiemannCvs.BlockGapTransfer.quarticEvenOddSeparationFromCouplingBudget',
          }
          names = [name for name, _ in reports]
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit(f'Incomplete axiom report: {names!r}')

          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for name, body in reports:
              axioms = set(re.findall(r'[A-Za-z0-9_.]+', body))
              unexpected = axioms - allowed
              if unexpected:
                  raise SystemExit(
                      f'Unexpected axioms for {name}: {sorted(unexpected)!r}'
                  )
          print('Axiom audit passed for all block-gap theorems.')
          PY

      - name: Upload axiom report
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-block-gap-axioms
          path: research/riemann-cvs-lean/block-gap-axioms.txt
