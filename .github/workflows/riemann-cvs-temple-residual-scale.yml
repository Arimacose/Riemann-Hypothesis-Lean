name: Riemann CvS Temple residual-scale verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - research/riemann-cvs-lean/RiemannCvs/TempleResidualScale.lean
      - .github/workflows/riemann-cvs-temple-residual-scale.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Elaborate Temple residual-scale module
        working-directory: research/riemann-cvs-lean
        run: |
          set -euo pipefail
          lake build RiemannCvs.TempleResidualScale

      - name: Reject placeholders and audit axioms
        working-directory: research/riemann-cvs-lean
        run: |
          set -euo pipefail
          if grep -R -nE '\b(sorry|admit)\b' RiemannCvs/TempleResidualScale.lean; then
            echo 'placeholder detected' >&2
            exit 1
          fi
          if grep -R -nE '^\s*(axiom|constant)\b' RiemannCvs/TempleResidualScale.lean; then
            echo 'user axiom/constant detected' >&2
            exit 1
          fi
          cat > /tmp/TempleResidualScaleAxioms.lean <<'LEAN'
          import RiemannCvs.TempleResidualScale
          #print axioms RiemannCvs.TempleResidualScale.squareRootDefectResidualLoss
          #print axioms RiemannCvs.TempleResidualScale.squareRootResidualRelativeIdentity
          #print axioms RiemannCvs.TempleResidualScale.squareRootResidualNecessaryCondition
          #print axioms RiemannCvs.TempleResidualScale.defectLinearResidualLoss
          #print axioms RiemannCvs.TempleResidualScale.defectLinearResidualPreservesFraction
          LEAN
          lake env lean /tmp/TempleResidualScaleAxioms.lean | tee /tmp/axioms.log
          if grep -vE 'propext|Classical.choice|Quot.sound|depends on axioms|^$' /tmp/axioms.log | grep -E 'axiom'; then
            echo 'unexpected axiom detected' >&2
            exit 1
          fi
