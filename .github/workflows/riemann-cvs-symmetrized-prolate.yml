name: Riemann CvS symmetrized-prolate verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateBridge.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateBridge.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build exact symmetrization module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.SymmetrizedProlateBridge

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/SymmetrizedProlateBridge.lean; then
            exit 1
          fi
          cat > /tmp/SymmetrizedProlateAxioms.lean <<'EOF'
          import RiemannCvs.SymmetrizedProlateBridge
          #print axioms RiemannCvs.SymmetrizedProlateBridge.symmetrize_fourier_eigenvector
          #print axioms RiemannCvs.SymmetrizedProlateBridge.boundary_zero_of_source_constraint
          #print axioms RiemannCvs.SymmetrizedProlateBridge.transformed_boundary_zero
          #print axioms RiemannCvs.SymmetrizedProlateBridge.tail_symmetrize
          #print axioms RiemannCvs.SymmetrizedProlateBridge.retained_symmetrize_of_compressed_eigenvector
          #print axioms RiemannCvs.SymmetrizedProlateBridge.norm_tail_symmetrize
          #print axioms RiemannCvs.SymmetrizedProlateBridge.normSq_symmetrize_unit
          #print axioms RiemannCvs.SymmetrizedProlateBridge.normalized_tail_fraction
          EOF
          lake env lean /tmp/SymmetrizedProlateAxioms.lean | tee symmetrized-prolate-axioms.txt
          if grep -E 'sorryAx' symmetrized-prolate-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-symmetrized-prolate-axioms
          path: research/riemann-cvs-lean/symmetrized-prolate-axioms.txt
