name: Riemann CvS conductor-defect coercivity verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ConductorDefectCoercivity.lean'
      - '.github/workflows/riemann-cvs-conductor-defect-coercivity.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ConductorDefectCoercivity.lean'
      - '.github/workflows/riemann-cvs-conductor-defect-coercivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build conductor-defect coercivity module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.ConductorDefectCoercivity

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/ConductorDefectCoercivity.lean; then
            exit 1
          fi
          cat > /tmp/ConductorDefectCoercivityAxioms.lean <<'EOF'
          import RiemannCvs.ConductorDefectCoercivity
          #print axioms RiemannCvs.ConductorDefectCoercivity.oneModeDefectCoefficient
          #print axioms RiemannCvs.ConductorDefectCoercivity.threeModeConductorLower
          #print axioms RiemannCvs.ConductorDefectCoercivity.threeModeConductorAtLeastLogDefect
          #print axioms RiemannCvs.ConductorDefectCoercivity.addPerturbationToConductorLower
          EOF
          lake env lean /tmp/ConductorDefectCoercivityAxioms.lean | tee conductor-defect-coercivity-axioms.txt
          if grep -E 'sorryAx' conductor-defect-coercivity-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-conductor-defect-coercivity-axioms
          path: research/riemann-cvs-lean/conductor-defect-coercivity-axioms.txt
