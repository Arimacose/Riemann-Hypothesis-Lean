name: Riemann CvS prolate-conductor verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateConductorIdentity.lean'
      - '.github/workflows/riemann-cvs-prolate-conductor.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateConductorIdentity.lean'
      - '.github/workflows/riemann-cvs-prolate-conductor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build prolate conductor module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.ProlateConductorIdentity

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/ProlateConductorIdentity.lean; then
            exit 1
          fi
          cat > /tmp/ProlateConductorAxioms.lean <<'EOF'
          import RiemannCvs.ProlateConductorIdentity
          #print axioms RiemannCvs.ProlateConductorIdentity.fourier_tail_identity
          #print axioms RiemannCvs.ProlateConductorIdentity.fourier_tail_identity_with_defect
          #print axioms RiemannCvs.ProlateConductorIdentity.transformedMultiplicationEnergy
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorEnergyIdentity
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorEnergyIdentityOfConcentrationDefect
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorLowerBound
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorUpperBound
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorComparableToLogScale
          EOF
          lake env lean /tmp/ProlateConductorAxioms.lean | tee prolate-conductor-axioms.txt
          if grep -E 'sorryAx' prolate-conductor-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-prolate-conductor-axioms
          path: research/riemann-cvs-lean/prolate-conductor-axioms.txt
