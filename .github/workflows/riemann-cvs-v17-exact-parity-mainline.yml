name: Riemann CvS V17 exact-parity mainline verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/V17ExactParityMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateBridge.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateSecular.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateGap.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateConductorIdentity.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ConductorDefectCoercivity.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedSymmetrizedConductor.lean'
      - '.github/workflows/riemann-cvs-v17-exact-parity-mainline.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/V17ExactParityMainline.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateBridge.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateSecular.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateGap.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateConductorIdentity.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ConductorDefectCoercivity.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedSymmetrizedConductor.lean'
      - '.github/workflows/riemann-cvs-v17-exact-parity-mainline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build V17 exact-parity mainline
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.V17ExactParityMainline

      - name: Reject placeholders in V17 modules
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/OddTempleParityTransfer.lean
            RiemannCvs/SymmetrizedProlateBridge.lean
            RiemannCvs/SymmetrizedProlateSecular.lean
            RiemannCvs/SymmetrizedProlateGap.lean
            RiemannCvs/ProlateConductorIdentity.lean
            RiemannCvs/ExteriorLogMomentTransfer.lean
            RiemannCvs/ConductorDefectCoercivity.lean
            RiemannCvs/NormalizedSymmetrizedConductor.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            exit 1
          fi
          cat > /tmp/V17MainlineAxioms.lean <<'EOF'
          import RiemannCvs.V17ExactParityMainline
          #print axioms RiemannCvs.OddTempleParityTransfer.fixedHermiteGroundParityFromTempleData
          #print axioms RiemannCvs.SymmetrizedProlateBridge.symmetrize_fourier_eigenvector
          #print axioms RiemannCvs.SymmetrizedProlateBridge.normalized_tail_fraction
          #print axioms RiemannCvs.SymmetrizedProlateSecular.twoPoleWeightPerturbation
          #print axioms RiemannCvs.SymmetrizedProlateGap.normalizedHighGap
          #print axioms RiemannCvs.ProlateConductorIdentity.conductorEnergyIdentityOfConcentrationDefect
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfCommonScale
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.weightedCosSqIntegralLower
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseOscillatoryIntegralBoundByVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseWeightedCosSqLowerOfVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.massLowerOfReferenceAndQuarterError
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.exteriorEnvelopeLogMomentBound
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfSechEnvelope
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.oneSidedExteriorMassOfConcentration
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfConcentrationDefectEnvelope
          #print axioms RiemannCvs.ConductorDefectCoercivity.threeModeConductorAtLeastLogDefect
          #print axioms RiemannCvs.NormalizedSymmetrizedConductor.normalizedExactParityConductorBound
          EOF
          lake env lean /tmp/V17MainlineAxioms.lean | tee v17-mainline-axioms.txt
          if grep -E 'sorryAx' v17-mainline-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v17-mainline-axioms
          path: research/riemann-cvs-lean/v17-mainline-axioms.txt
