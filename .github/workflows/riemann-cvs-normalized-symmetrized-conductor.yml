name: Riemann CvS normalized symmetrized-conductor verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedSymmetrizedConductor.lean'
      - '.github/workflows/riemann-cvs-normalized-symmetrized-conductor.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/NormalizedSymmetrizedConductor.lean'
      - '.github/workflows/riemann-cvs-normalized-symmetrized-conductor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build normalized conductor module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.NormalizedSymmetrizedConductor

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/NormalizedSymmetrizedConductor.lean; then
            exit 1
          fi
          cat > /tmp/NormalizedSymmetrizedConductorAxioms.lean <<'EOF'
          import RiemannCvs.NormalizedSymmetrizedConductor
          #print axioms RiemannCvs.NormalizedSymmetrizedConductor.normalizeTwoSidedFormBound
          #print axioms RiemannCvs.NormalizedSymmetrizedConductor.normalizeSymmetrizedTailBound
          #print axioms RiemannCvs.NormalizedSymmetrizedConductor.normalizedExactParityConductorBound
          #print axioms RiemannCvs.NormalizedSymmetrizedConductor.normalizedQuarticRatio
          EOF
          lake env lean /tmp/NormalizedSymmetrizedConductorAxioms.lean | tee normalized-symmetrized-conductor-axioms.txt
          if grep -E 'sorryAx' normalized-symmetrized-conductor-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-normalized-symmetrized-conductor-axioms
          path: research/riemann-cvs-lean/normalized-symmetrized-conductor-axioms.txt
