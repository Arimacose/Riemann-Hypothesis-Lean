name: Riemann CvS symmetrized-prolate secular verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateSecular.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate-secular.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateSecular.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate-secular.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build symmetrized secular module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.SymmetrizedProlateSecular

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/SymmetrizedProlateSecular.lean; then
            exit 1
          fi
          cat > /tmp/SymmetrizedProlateSecularAxioms.lean <<'EOF'
          import RiemannCvs.SymmetrizedProlateSecular
          #print axioms RiemannCvs.SymmetrizedProlateSecular.normalizedDefectIdentity
          #print axioms RiemannCvs.SymmetrizedProlateSecular.normalizedBoundaryResidueIdentity
          #print axioms RiemannCvs.SymmetrizedProlateSecular.normalizedDefectRatioIdentity
          #print axioms RiemannCvs.SymmetrizedProlateSecular.quarticBoundForNormalizedSymmetrizedDefects
          #print axioms RiemannCvs.SymmetrizedProlateSecular.twoPoleWeightPerturbation
          #print axioms RiemannCvs.SymmetrizedProlateSecular.symmetrizedTwoPoleWeightPerturbation
          #print axioms RiemannCvs.SymmetrizedProlateSecular.twoModeBoundaryEnergyIdentity
          EOF
          lake env lean /tmp/SymmetrizedProlateSecularAxioms.lean | tee symmetrized-prolate-secular-axioms.txt
          if grep -E 'sorryAx' symmetrized-prolate-secular-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-symmetrized-prolate-secular-axioms
          path: research/riemann-cvs-lean/symmetrized-prolate-secular-axioms.txt
