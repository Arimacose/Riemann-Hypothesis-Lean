name: Riemann CvS symmetrized-prolate orthogonality verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateOrthogonality.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate-orthogonality.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/SymmetrizedProlateOrthogonality.lean'
      - '.github/workflows/riemann-cvs-symmetrized-prolate-orthogonality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build symmetrized orthogonality module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.SymmetrizedProlateOrthogonality

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/SymmetrizedProlateOrthogonality.lean; then
            exit 1
          fi
          cat > /tmp/SymmetrizedProlateOrthogonalityAxioms.lean <<'EOF'
          import RiemannCvs.SymmetrizedProlateOrthogonality
          #print axioms RiemannCvs.SymmetrizedProlateOrthogonality.residualsOrthogonal
          #print axioms RiemannCvs.SymmetrizedProlateOrthogonality.retained_tail_cross_zero
          #print axioms RiemannCvs.SymmetrizedProlateOrthogonality.prolateTailsOrthogonal
          #print axioms RiemannCvs.SymmetrizedProlateOrthogonality.symmetrizedModesOrthogonal
          #print axioms RiemannCvs.SymmetrizedProlateOrthogonality.threeTailCombinationNormSq
          EOF
          lake env lean /tmp/SymmetrizedProlateOrthogonalityAxioms.lean | tee symmetrized-prolate-orthogonality-axioms.txt
          if grep -E 'sorryAx' symmetrized-prolate-orthogonality-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-symmetrized-prolate-orthogonality-axioms
          path: research/riemann-cvs-lean/symmetrized-prolate-orthogonality-axioms.txt
