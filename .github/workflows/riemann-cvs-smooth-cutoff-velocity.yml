name: Riemann CvS smooth-cutoff velocity audit

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - research/riemann-cvs-numerics/explore_smooth_cutoff_velocity.py
      - .github/workflows/riemann-cvs-smooth-cutoff-velocity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mpmath==1.3.0 numpy==2.3.2

      - name: Run smooth-cutoff velocity audit
        run: |
          set -euo pipefail
          mkdir -p research/riemann-cvs-numerics/artifacts
          python research/riemann-cvs-numerics/explore_smooth_cutoff_velocity.py \
            --N 12 \
            --dps 80 \
            --step 2e-5 \
            --json-out research/riemann-cvs-numerics/artifacts/smooth_cutoff_velocity.json

      - name: Validate and summarize audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/riemann-cvs-numerics/artifacts/smooth_cutoff_velocity.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'PASS'
          print(json.dumps({
              'status': data['status'],
              'scope': data['scope'],
              'cases': [
                  {
                      'c': row['c'],
                      'even_constant_residual': row['even']['constant_relative_residual'],
                      'even_affine_residual': row['even']['affine_relative_residual'],
                      'odd_affine_residual': row['odd_candidate_first_moment']['affine_relative_residual'],
                  }
                  for row in data['cases']
              ],
          }, indent=2))
          PY

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-smooth-cutoff-velocity
          path: research/riemann-cvs-numerics/artifacts/smooth_cutoff_velocity.json
          if-no-files-found: error
