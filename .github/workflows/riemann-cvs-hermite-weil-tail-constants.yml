name: Riemann CvS Hermite Weil-tail constants verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteWeilTailConstants.lean'
      - '.github/workflows/riemann-cvs-hermite-weil-tail-constants.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/HermiteWeilTailConstants.lean'
      - '.github/workflows/riemann-cvs-hermite-weil-tail-constants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build Hermite Weil-tail constants module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.HermiteWeilTailConstants

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/HermiteWeilTailConstants.lean; then
            exit 1
          fi
          cat > /tmp/HermiteWeilTailConstantsAxioms.lean <<'EOF'
          import RiemannCvs.HermiteWeilTailConstants
          #print axioms RiemannCvs.HermiteWeilTailConstants.normalizedHermiteLeadingRatio
          #print axioms RiemannCvs.HermiteWeilTailConstants.hermiteCoefficient_eq_sixteen_mul_prolateCoefficient
          #print axioms RiemannCvs.HermiteWeilTailConstants.hermiteCoefficient_lt_oneQuarter
          #print axioms RiemannCvs.HermiteWeilTailConstants.hermiteCoefficient_lt_nineSixteenths
          EOF
          lake env lean /tmp/HermiteWeilTailConstantsAxioms.lean | tee hermite-weil-tail-constants-axioms.txt
          if grep -E 'sorryAx' hermite-weil-tail-constants-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-hermite-weil-tail-constants-axioms
          path: research/riemann-cvs-lean/hermite-weil-tail-constants-axioms.txt
