name: Riemann CvS V17 stationary-geometry verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateCrossDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateScaledStationaryFamily.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0Series.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0DifferentialEquation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0IntegralRepresentation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0StationaryPhase.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0Dlmf.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - '.github/workflows/riemann-cvs-v17-stationary-geometry.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateCrossDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateScaledStationaryFamily.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0Series.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0DifferentialEquation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0IntegralRepresentation.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0StationaryPhase.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/BesselJ0Dlmf.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - '.github/workflows/riemann-cvs-v17-stationary-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Elaborate and compile V17 stationary modules
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RiemannCvs/ProlateDilationStationaryPoint.lean
          lake env lean RiemannCvs/ProlateCrossDilationStationaryPoint.lean
          lake env lean RiemannCvs/ProlateScaledStationaryFamily.lean
          lake env lean RiemannCvs/BesselJ0Series.lean
          lake build RiemannCvs.BesselJ0Series
          lake env lean RiemannCvs/BesselJ0DifferentialEquation.lean
          lake build RiemannCvs.BesselJ0DifferentialEquation
          lake env lean RiemannCvs/BesselJ0IntegralRepresentation.lean
          lake build RiemannCvs.BesselJ0IntegralRepresentation
          lake env lean RiemannCvs/BesselJ0StationaryPhase.lean
          lake build RiemannCvs.BesselJ0StationaryPhase
          lake env lean RiemannCvs/BesselJ0Dlmf.lean
          lake build RiemannCvs.BesselJ0Dlmf
          lake env lean RiemannCvs/ExteriorLogMomentTransfer.lean
          lake build \
            RiemannCvs.ProlateDilationStationaryPoint \
            RiemannCvs.ProlateCrossDilationStationaryPoint \
            RiemannCvs.ProlateScaledStationaryFamily \
            RiemannCvs.BesselJ0Series \
            RiemannCvs.BesselJ0DifferentialEquation \
            RiemannCvs.BesselJ0IntegralRepresentation \
            RiemannCvs.BesselJ0StationaryPhase \
            RiemannCvs.BesselJ0Dlmf \
            RiemannCvs.ExteriorLogMomentTransfer
      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/ProlateDilationStationaryPoint.lean
            RiemannCvs/ProlateCrossDilationStationaryPoint.lean
            RiemannCvs/ProlateScaledStationaryFamily.lean
            RiemannCvs/BesselJ0Series.lean
            RiemannCvs/BesselJ0DifferentialEquation.lean
            RiemannCvs/BesselJ0IntegralRepresentation.lean
            RiemannCvs/BesselJ0StationaryPhase.lean
            RiemannCvs/BesselJ0Dlmf.lean
            RiemannCvs/ExteriorLogMomentTransfer.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' "${files[@]}"; then
            exit 1
          fi
          cat > V17StationaryAxioms.lean <<'EOF'
          import RiemannCvs.ProlateDilationStationaryPoint
          import RiemannCvs.ProlateCrossDilationStationaryPoint
          import RiemannCvs.ProlateScaledStationaryFamily
          import RiemannCvs.BesselJ0Series
          import RiemannCvs.BesselJ0DifferentialEquation
          import RiemannCvs.BesselJ0IntegralRepresentation
          import RiemannCvs.BesselJ0StationaryPhase
          import RiemannCvs.BesselJ0Dlmf
          import RiemannCvs.ExteriorLogMomentTransfer
          #print axioms RiemannCvs.ProlateDilationStationaryPoint.rootWidthBudget
          #print axioms RiemannCvs.ProlateDilationStationaryPoint.prolateSlopeBoundsOnTwoThree
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.scaledRootLayer
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.uniqueScaledRoot
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.curvatureScaleFromBudgets
          #print axioms RiemannCvs.ProlateScaledStationaryFamily.scaledSlopePolynomialAtReciprocal
          #print axioms RiemannCvs.BesselJ0Series.summable_besselJ0Term
          #print axioms RiemannCvs.BesselJ0Series.tendstoUniformlyOn_besselJ0_partialSums_Icc
          #print axioms RiemannCvs.BesselJ0Series.continuous_besselJ0
          #print axioms RiemannCvs.BesselJ0Series.besselJ0_zero
          #print axioms RiemannCvs.BesselJ0Series.besselJ0_neg
          #print axioms RiemannCvs.BesselJ0Series.besselJ0Term_succ
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.hasDerivAt_besselJ0
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.hasDerivAt_besselJ0Deriv
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.differentiable_deriv_besselJ0
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.besselJ0SecondDeriv_zero
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.deriv_deriv_besselJ0_zero
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.besselJ0_differentialEquation
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.besselJ0_deriv_differentialEquation
          #print axioms RiemannCvs.BesselJ0DifferentialEquation.besselJ0_second_order_differentialEquation
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.wallisProduct_eq_factorialRatio
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.integral_sin_pow_even_factorial
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.hasSum_integral_cosineSeriesTerm
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.integral_cosineSeriesTerm
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.besselJ0Integral_eq_besselJ0
          #print axioms RiemannCvs.BesselJ0IntegralRepresentation.besselJ0_integral_representation
          #print axioms RiemannCvs.BesselJ0StationaryPhase.integral_cos_sin_eq_centered
          #print axioms RiemannCvs.BesselJ0StationaryPhase.besselJ0_half_interval_representation
          #print axioms RiemannCvs.BesselJ0StationaryPhase.stationaryPhase_secondDerivative_at_zero
          #print axioms RiemannCvs.BesselJ0StationaryPhase.stationaryPhaseDerivative_eq_zero_iff
          #print axioms RiemannCvs.BesselJ0StationaryPhase.strictMonoOn_stationaryCoordinate
          #print axioms RiemannCvs.BesselJ0StationaryPhase.oscillatoryIntegrand_quadratic_split
          #print axioms RiemannCvs.BesselJ0Dlmf.concreteJ0_integral_representation
          #print axioms RiemannCvs.BesselJ0Dlmf.concreteJ0_half_interval_representation
          #print axioms RiemannCvs.BesselJ0Dlmf.orderZeroCoefficient_three
          #print axioms RiemannCvs.BesselJ0Dlmf.firstRemainderEnvelope_nonneg
          #print axioms RiemannCvs.BesselJ0Dlmf.leadingCosine_error_of_separated_remainders
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.normalizedWeightedMomentBound
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.weightedCosSqIntegralLower
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseOscillatoryIntegralBoundByVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseWeightedCosSqLowerOfVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.nonlinearPhaseWeightedCosSqLowerOfVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.nonlinearPhaseWeightedCosSqLowerOfUniformBudget
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedWeightMassLowerOnTwoThree
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedIntervalWeightedCosSqLower
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedIntervalActualMassLowerOfInvFrequencyError
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedPhaseActualMassLowerOfInvFrequencyError
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.sq_add_le_two_invFrequencyErrorBudget
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedPhaseActualMassLowerOfSeparatedErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.sourcePhase_eq_prolateFixedPhase_add_base
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.sourcePhaseCosine_eq_prolateFixedPhaseCosine
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedCosineReference_sq
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateParameter_le_half_of_invFrequency
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedPhaseActualMassLowerOfCanonicalReference
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedDunsterBesselScale_sq
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.sourcePhase_one_le_onTwoThree
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedSourceCosineReference_sq
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dlmfJ0FirstRemainderBudget
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.besselJ0LeadingCosineErrorOfDlmfBudget
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedSourceActualMassLowerOfRawDunsterBesselErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedSourceActualMassLowerOfDlmfDunsterErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedSourceActualMassLowerOfConcreteJ0DlmfDunsterErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.concreteJ0DlmfAbsoluteErrorPointwiseOfGlobal
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedSourceActualMassLowerOfConcreteJ0GlobalDlmf
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfProlateFixedPhaseApproximation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfSeparatedDunsterBesselErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfCanonicalReferenceAndSeparatedErrors
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfDlmfDunsterSource
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfConcreteJ0DunsterSource
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfConcreteJ0GlobalDlmfSource
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.massLowerOfReferenceAndQuarterError
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.exteriorEnvelopeLogMomentBound
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfSechEnvelope
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.oneSidedExteriorMassOfConcentration
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfConcentrationDefectEnvelope
          EOF
          lake env lean V17StationaryAxioms.lean | tee v17-stationary-axioms.txt
          if grep -E 'sorryAx' v17-stationary-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v17-stationary-axioms
          path: research/riemann-cvs-lean/v17-stationary-axioms.txt
