name: Riemann CvS V17 stationary-geometry verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateCrossDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateScaledStationaryFamily.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - '.github/workflows/riemann-cvs-v17-stationary-geometry.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateCrossDilationStationaryPoint.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ProlateScaledStationaryFamily.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/ExteriorLogMomentTransfer.lean'
      - '.github/workflows/riemann-cvs-v17-stationary-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Elaborate and compile V17 stationary modules
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean RiemannCvs/ProlateDilationStationaryPoint.lean
          lake env lean RiemannCvs/ProlateCrossDilationStationaryPoint.lean
          lake env lean RiemannCvs/ProlateScaledStationaryFamily.lean
          lake env lean RiemannCvs/ExteriorLogMomentTransfer.lean
          lake build \
            RiemannCvs.ProlateDilationStationaryPoint \
            RiemannCvs.ProlateCrossDilationStationaryPoint \
            RiemannCvs.ProlateScaledStationaryFamily \
            RiemannCvs.ExteriorLogMomentTransfer
      - name: Reject placeholders and print axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          files=(
            RiemannCvs/ProlateDilationStationaryPoint.lean
            RiemannCvs/ProlateCrossDilationStationaryPoint.lean
            RiemannCvs/ProlateScaledStationaryFamily.lean
            RiemannCvs/ExteriorLogMomentTransfer.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            exit 1
          fi
          cat > V17StationaryAxioms.lean <<'EOF'
          import RiemannCvs.ProlateDilationStationaryPoint
          import RiemannCvs.ProlateCrossDilationStationaryPoint
          import RiemannCvs.ProlateScaledStationaryFamily
          import RiemannCvs.ExteriorLogMomentTransfer
          #print axioms RiemannCvs.ProlateDilationStationaryPoint.rootWidthBudget
          #print axioms RiemannCvs.ProlateDilationStationaryPoint.prolateSlopeBoundsOnTwoThree
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.scaledRootLayer
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.uniqueScaledRoot
          #print axioms RiemannCvs.ProlateCrossDilationStationaryPoint.curvatureScaleFromBudgets
          #print axioms RiemannCvs.ProlateScaledStationaryFamily.scaledSlopePolynomialAtReciprocal
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.normalizedWeightedMomentBound
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.weightedCosSqIntegralLower
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseOscillatoryIntegralBoundByVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.linearPhaseWeightedCosSqLowerOfVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.nonlinearPhaseWeightedCosSqLowerOfVariation
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.nonlinearPhaseWeightedCosSqLowerOfUniformBudget
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedWeightMassLowerOnTwoThree
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.prolateFixedIntervalWeightedCosSqLower
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.massLowerOfReferenceAndQuarterError
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.exteriorEnvelopeLogMomentBound
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfSechEnvelope
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.oneSidedExteriorMassOfConcentration
          #print axioms RiemannCvs.ExteriorLogMomentTransfer.dilationLogMomentBoundsOfConcentrationDefectEnvelope
          EOF
          lake env lean V17StationaryAxioms.lean | tee v17-stationary-axioms.txt
          if grep -E 'sorryAx' v17-stationary-axioms.txt; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-v17-stationary-axioms
          path: research/riemann-cvs-lean/v17-stationary-axioms.txt
