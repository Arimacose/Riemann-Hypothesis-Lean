name: Riemann CvS boundary-layer budget verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryLayerBudget.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - '.github/workflows/riemann-cvs-boundary-layer-budget.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/BoundaryLayerBudget.lean'
      - 'research/riemann-cvs-lean/RiemannCvs/OddTempleParityTransfer.lean'
      - '.github/workflows/riemann-cvs-boundary-layer-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build boundary-layer budget module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.BoundaryLayerBudget

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/BoundaryLayerBudget.lean; then
            exit 1
          fi
          cat > /tmp/BoundaryLayerBudgetAxioms.lean <<'EOF'
          import RiemannCvs.BoundaryLayerBudget
          #print axioms RiemannCvs.BoundaryLayerBudget.quarterRelativeErrorFromBoundedRemainder
          #print axioms RiemannCvs.BoundaryLayerBudget.quarterTempleResidualFromBoundedCoefficient
          #print axioms RiemannCvs.BoundaryLayerBudget.fixedHermiteGroundParityFromBoundedRemainders
          EOF
          lake env lean /tmp/BoundaryLayerBudgetAxioms.lean | tee boundary-layer-budget-axioms.txt
          if grep -E 'sorryAx' boundary-layer-budget-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-boundary-layer-budget-axioms
          path: research/riemann-cvs-lean/boundary-layer-budget-axioms.txt
