name: Riemann CvS prime-event parity verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - research/riemann-cvs-lean/RiemannCvs/PrimeEventParityMonotonicity.lean
      - .github/workflows/riemann-cvs-prime-event-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build prime-event parity module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.PrimeEventParityMonotonicity

      - name: Reject placeholders and audit axioms
        working-directory: research/riemann-cvs-lean
        run: |
          set -euo pipefail
          if grep -RInE --include='*.lean' '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' \
              RiemannCvs/PrimeEventParityMonotonicity.lean; then
            echo 'Forbidden placeholder or user axiom found.' >&2
            exit 1
          fi
          cat > PrimeEventParityAudit.lean <<'EOF'
          import RiemannCvs.PrimeEventParityMonotonicity
          #print axioms RiemannCvs.PrimeEventParityMonotonicity.rankOneEventLowersRayleigh
          #print axioms RiemannCvs.PrimeEventParityMonotonicity.strictParityOrderSurvivesEvent
          #print axioms RiemannCvs.PrimeEventParityMonotonicity.parityGapNondecreasingAtEvent
          #print axioms RiemannCvs.PrimeEventParityMonotonicity.strictParityOrderSurvivesRankOneFormula
          #print axioms RiemannCvs.PrimeEventParityMonotonicity.strictOrderAfterTwoEvents
          EOF
          lake env lean PrimeEventParityAudit.lean | tee prime-event-parity-axioms.txt
          if grep -Ev '^RiemannCvs\.|^\x27RiemannCvs\.|^\[propext, Classical.choice, Quot.sound\]$|^\[propext, Quot.sound, Classical.choice\]$|^\[Classical.choice, propext, Quot.sound\]$|^\[Classical.choice, Quot.sound, propext\]$|^\[Quot.sound, propext, Classical.choice\]$|^\[Quot.sound, Classical.choice, propext\]$|^\[\]$|^[[:space:]]*$' prime-event-parity-axioms.txt | grep -q .; then
            echo 'Unexpected axiom-audit output:' >&2
            cat prime-event-parity-axioms.txt >&2
            exit 1
          fi
