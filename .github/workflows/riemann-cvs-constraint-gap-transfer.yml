name: Riemann CvS eighth-power constraint-gap verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ConstraintGapTransfer.lean'
      - '.github/workflows/riemann-cvs-constraint-gap-transfer.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/ConstraintGapTransfer.lean'
      - '.github/workflows/riemann-cvs-constraint-gap-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build eighth-power constraint-gap module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.ConstraintGapTransfer

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/ConstraintGapTransfer.lean; then
            exit 1
          fi
          cat > /tmp/ConstraintGapTransferAxioms.lean <<'EOF'
          import RiemannCvs.ConstraintGapTransfer
          #print axioms RiemannCvs.ConstraintGapTransfer.eighthPowerGapTransfer
          #print axioms RiemannCvs.ConstraintGapTransfer.commonLeadingEighthPowerGap
          #print axioms RiemannCvs.ConstraintGapTransfer.commonLeadingAbsoluteErrorEighthPowerGap
          #print axioms RiemannCvs.ConstraintGapTransfer.twoSectorEighthPowerGaps
          #print axioms RiemannCvs.ConstraintGapTransfer.defectZeroOverFour
          #print axioms RiemannCvs.ConstraintGapTransfer.defectTwoOverSix
          #print axioms RiemannCvs.ConstraintGapTransfer.plusLowDefectLambdaCoefficient
          #print axioms RiemannCvs.ConstraintGapTransfer.minusLowDefectLambdaCoefficient
          #print axioms RiemannCvs.ConstraintGapTransfer.plusConstraintGapCoefficient
          #print axioms RiemannCvs.ConstraintGapTransfer.minusConstraintGapCoefficient
          #print axioms RiemannCvs.ConstraintGapTransfer.plusConstraintGapCoefficient_lt_oneOverHundredThousand
          #print axioms RiemannCvs.ConstraintGapTransfer.minusConstraintGapCoefficient_lt_oneOverEightThousand
          EOF
          lake env lean /tmp/ConstraintGapTransferAxioms.lean | tee constraint-gap-transfer-axioms.txt
          if grep -E 'sorryAx' constraint-gap-transfer-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-constraint-gap-transfer-axioms
          path: research/riemann-cvs-lean/constraint-gap-transfer-axioms.txt
