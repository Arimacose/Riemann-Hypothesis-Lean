name: Riemann CvS common-leading Weil-tail verification

on:
  push:
    branches:
      - research/cvs-prolate-v17
      - main
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/CommonLeadingWeilTransfer.lean'
      - '.github/workflows/riemann-cvs-common-leading-weil.yml'
  pull_request:
    paths:
      - 'research/riemann-cvs-lean/RiemannCvs/CommonLeadingWeilTransfer.lean'
      - '.github/workflows/riemann-cvs-common-leading-weil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@6835ef47e8423fa9e9eacfcbb8fdf83fae42c820
        with:
          lake-package-directory: research/riemann-cvs-lean
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build common-leading transfer module
        working-directory: research/riemann-cvs-lean
        run: lake build RiemannCvs.CommonLeadingWeilTransfer

      - name: Reject placeholders and print theorem axioms
        working-directory: research/riemann-cvs-lean
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            RiemannCvs/CommonLeadingWeilTransfer.lean; then
            exit 1
          fi
          cat > /tmp/CommonLeadingWeilAxioms.lean <<'EOF'
          import RiemannCvs.CommonLeadingWeilTransfer
          #print axioms RiemannCvs.CommonLeadingWeilTransfer.commonLeadingQuarticTransfer
          #print axioms RiemannCvs.CommonLeadingWeilTransfer.commonLeadingAbsoluteErrorTransfer
          #print axioms RiemannCvs.CommonLeadingWeilTransfer.fixedHermiteParityFromHalfRelativeError
          #print axioms RiemannCvs.CommonLeadingWeilTransfer.fixedHermiteParityFromQuarterRelativeError
          EOF
          lake env lean /tmp/CommonLeadingWeilAxioms.lean | tee common-leading-weil-axioms.txt
          if grep -E 'sorryAx' common-leading-weil-axioms.txt; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: riemann-cvs-common-leading-weil-axioms
          path: research/riemann-cvs-lean/common-leading-weil-axioms.txt
